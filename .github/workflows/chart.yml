name: Chart

on:
  push:
    branches: [main]
    paths: ["deploy/**", ".github/workflows/chart.yml"]
  pull_request:
    paths: ["deploy/**", ".github/workflows/chart.yml"]

permissions:
  contents: read

jobs:
  lint:
    name: helm lint and render
    runs-on: ubuntu-24.04
    env:
      CHART: deploy/charts/release-guardian
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: azure/setup-helm@v4.2.0
        with:
          version: v3.16.2
      - name: Lint with every values file
        run: |
          helm lint "$CHART" --strict
          helm lint "$CHART" --strict -f "$CHART/values-kind.yaml"
          helm lint "$CHART" --strict -f "$CHART/values-aks.yaml"
      - name: Render templates
        run: |
          mkdir -p rendered
          helm template release-guardian "$CHART" -n release-guardian > rendered/default.yaml
          helm template release-guardian "$CHART" -n release-guardian -f "$CHART/values-kind.yaml" > rendered/kind.yaml
          helm template release-guardian "$CHART" -n release-guardian -f "$CHART/values-aks.yaml" > rendered/aks.yaml
      - uses: actions/upload-artifact@v4.4.3
        with:
          name: rendered-manifests
          path: rendered/
