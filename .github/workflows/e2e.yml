name: E2E rollback proof

# Proves the core promise on a throwaway kind cluster: a healthy release is
# promoted, and a broken one (failing, then slow) is detected by metric
# analysis, aborted, and rolled back automatically.
# Uses the same scripts as the local demo (make up / make demo-bad).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "deploy/charts/**"
      - "deploy/observability/kube-prometheus-stack/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/e2e.yml"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rollback:
    name: broken release is rolled back
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: azure/setup-helm@v4.2.0
        with:
          version: v3.16.2

      - name: Install pinned kind and the Argo Rollouts kubectl plugin
        run: |
          source scripts/versions.env
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLo kubectl-argo-rollouts \
            "https://github.com/argoproj/argo-rollouts/releases/download/${ARGO_ROLLOUTS_VERSION}/kubectl-argo-rollouts-linux-amd64"
          sudo install -m 0755 kind kubectl-argo-rollouts /usr/local/bin/
          kind version

      - name: Create cluster and deploy version 1
        run: make up PROFILE=lean

      - name: Release a healthy version (must be promoted)
        run: make demo-good

      - name: Release a failing version (must be aborted and rolled back)
        run: make demo-bad FAULT_MODE=errors

      - name: Release a slow version (must be rolled back, anomaly score must be > 0)
        run: make demo-bad FAULT_MODE=latency

      - name: Collect diagnostics
        if: always()
        run: make diagnostics

      - name: Upload logs and rollout status
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: e2e-diagnostics
          path: artifacts/
          retention-days: 14
