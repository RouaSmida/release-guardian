{{- if .Values.podDisruptionBudget.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $ctx := dict "name" $name "root" $ }}
---
# Keeps at least one pod running during voluntary disruptions (node drain, upgrade).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "rg.labels" $ctx | nindent 4 }}
spec:
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "rg.selectorLabels" $ctx | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
