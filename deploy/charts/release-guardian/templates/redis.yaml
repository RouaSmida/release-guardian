{{- if .Values.redis.enabled }}
{{- $ctx := dict "name" "redis" "root" . }}
# Job queue between api and worker. Deliberately ephemeral (no persistence):
# jobs are demo data. Use a managed Redis for anything real.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "rg.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "rg.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rg.selectorLabels" $ctx | nindent 8 }}
    spec:
      serviceAccountName: release-guardian
      securityContext:
        {{- include "rg.podSecurityContext" $ctx | nindent 8 }}
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            {{- include "rg.containerSecurityContext" $ctx | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "rg.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "rg.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}
