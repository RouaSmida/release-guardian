{{- /*
  Queries only look at the canary's pods, selected by their pod-template hash
  (passed in by the Rollout as the "canary-hash" argument).

  The checks fail closed: "len(result) > 0 && result[0] < limit" is only true
  when Prometheus returned a real number below the limit. An empty result (no
  series, canary not scraped, no traffic) or NaN (0 requests / 0 requests) is a
  failed measurement, so a canary that cannot be judged is never promoted.
  The only tolerated gap is the error counter: it does not exist before the
  first error, which means "0 errors".
*/ -}}
{{- if .Values.rollout.analysis.enabled }}
{{- $a := .Values.rollout.analysis }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $ctx := dict "name" $name "root" $ }}
{{- $selector := printf "namespace=\"%s\",service=\"%s\",rollouts_pod_template_hash=\"{{args.canary-hash}}\"" $.Release.Namespace $name }}
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ $name }}-health
  labels:
    {{- include "rg.labels" $ctx | nindent 4 }}
spec:
  args:
    - name: canary-hash
  metrics:
    - name: error-rate
      interval: {{ $a.interval }}
      initialDelay: {{ $a.initialDelay }}
      failureLimit: {{ $a.failureLimit }}
      successCondition: len(result) > 0 && result[0] < {{ $svc.analysis.maxErrorRate }}
      provider:
        prometheus:
          address: {{ $.Values.prometheus.address }}
          query: |
            (sum(rate({{ $svc.metrics.errors }}{ {{- $selector -}} }[{{ $a.rateWindow }}])) or on() vector(0))
            /
            sum(rate({{ $svc.metrics.requests }}{ {{- $selector -}} }[{{ $a.rateWindow }}]))
    - name: p95-latency
      interval: {{ $a.interval }}
      initialDelay: {{ $a.initialDelay }}
      failureLimit: {{ $a.failureLimit }}
      successCondition: len(result) > 0 && result[0] < {{ $svc.analysis.maxP95Seconds }}
      provider:
        prometheus:
          address: {{ $.Values.prometheus.address }}
          query: |
            histogram_quantile(0.95, sum by (le) (rate({{ $svc.metrics.duration }}_bucket{ {{- $selector -}} }[{{ $a.rateWindow }}])))
{{- if and $.Values.anomalyDetector.enabled $svc.analysis.anomaly }}
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ $name }}-anomaly
  labels:
    {{- include "rg.labels" $ctx | nindent 4 }}
spec:
  args:
    - name: canary-hash   # not used by the query; declared so both templates accept the same args
  metrics:
    - name: anomaly-score
      interval: {{ $a.interval }}
      initialDelay: {{ $a.initialDelay }}
      failureLimit: {{ $a.failureLimit }}
      successCondition: len(result) > 0 && result[0] < {{ $a.anomalyThreshold }}
      provider:
        prometheus:
          address: {{ $.Values.prometheus.address }}
          query: |
            max(release_anomaly_score{namespace="{{ $.Release.Namespace }}",service="{{ $name }}"})
{{- end }}
{{- end }}
{{- end }}
{{- end }}
