{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $ctx := dict "name" $name "root" $ }}
---
# One Service selects stable and canary pods alike, so the canary receives a
# share of real traffic proportional to its number of pods.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "rg.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "rg.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
{{- end }}
