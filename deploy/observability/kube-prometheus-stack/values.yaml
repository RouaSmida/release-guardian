# kube-prometheus-stack (chart version pinned in scripts/versions.env and the ArgoCD Application).
# Installs the Prometheus Operator, Prometheus, Alertmanager, Grafana,
# kube-state-metrics and node-exporter.

prometheus:
  prometheusSpec:
    # Pick up PodMonitors, ServiceMonitors and PrometheusRules from every
    # namespace, not only the ones labelled with this Helm release.
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeInterval: 15s
    evaluationInterval: 15s
    retention: 2d
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits: { memory: 1Gi }

grafana:
  # The admin password is generated into the "kps-grafana" Secret; it is not
  # stored in Git. `make grafana` prints it.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL   # dashboards live next to the app, in its namespace
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.monitoring.svc:3100
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 64Mi }

# Control-plane components are not reachable on kind or on managed AKS;
# scraping them would only produce permanently firing "target down" alerts.
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
