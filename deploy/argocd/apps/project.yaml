# Limits what the platform Applications may deploy: only from the listed
# repositories, only into this cluster.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: release-guardian
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Release Guardian platform and demo application
  sourceRepos:
    - https://github.com/RouaSmida/release-guardian.git
    - https://argoproj.github.io/argo-helm
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
